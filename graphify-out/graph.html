  /* ===== CSS Variables & Theming ===== */
  :root {

    --border-color: #2a2a4e;
    --border-light: #3a3a5e;
    --text-primary: #e0e0e0;
    --text-secondary: #aaa;
    --text-muted: #666;

    --transition-speed: 0.25s;
  }
  .light-mode {
    --bg-primary: #f5f5fa;
    --bg-secondary: #ffffff;
    --bg-tertiary: #eef0f6;
    --border-color: #d0d0e0;
    --border-light: #c0c0d0;
    --text-primary: #1a1a2e;
    --text-secondary: #555;

    --shadow: 0 4px 20px rgba(0,0,0,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {

    transition: background var(--transition-speed), color var(--transition-speed);

  #graph { flex: 1; position: relative; }

    flex-direction: column;
    overflow: hidden;
    transition: background var(--transition-speed), border-color var(--transition-speed);
    backdrop-filter: blur(10px);
  }
  #search-wrap { padding: 12px; border-bottom: 1px solid var(--border-color); }
  #search {

    border: 1px solid var(--border-light);
    color: var(--text-primary);
    padding: 8px 12px;

    font-size: 13px;
    outline: none;

  }

    border-radius: 3px;
    background: var(--bg-primary);
    cursor: pointer;
    position: relative;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s;
  }
  .legend-cb:checked, #select-all-cb:checked { background: var(--accent); border-color: var(--accent); }
  .legend-cb:checked::after, #select-all-cb:checked::after {
    content: '';
    position: absolute;
    left: 3.5px;
    top: 1px;
    width: 4px;
    height: 7px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  #select-all-cb:indeterminate { background: var(--accent); border-color: var(--accent); }
  #select-all-cb:indeterminate::after {
    content: '';
    position: absolute;
    left: 2px;
    top: 5px;
    width: 8px;
    height: 2px;
    background: #fff;
    border: none;
    transform: none;
  }

  /* ===== Toolbar ===== */
  #toolbar {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 100;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px 8px;
    background: var(--toolbar-bg);
    border: 1px solid var(--toolbar-border);
    border-radius: 10px;
    backdrop-filter: blur(12px);
    box-shadow: var(--shadow);
    max-width: calc(100% - 24px);
    transition: background var(--transition-speed), border-color var(--transition-speed);
  }
  .tb-group {
    display: flex;
    gap: 2px;
    padding: 0 4px;
    border-right: 1px solid var(--border-color);
  }
  .tb-group:last-child { border-right: none; }
  .tb-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
    position: relative;
  }
  .tb-btn:hover {
    background: var(--bg-tertiary);
    color: var(--text-primary);
  }
  .tb-btn.active {

  .tb-btn[data-tooltip]:hover::after {

    color: var(--text-primary);

    white-space: nowrap;

  #minimap-wrap {

  }
  @keyframes glow {
    0%, 100% { filter: brightness(1); }

  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }

// HTML-escape helper — prevents XSS when injecting graph data into innerHTML
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Build vis datasets
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id, label: n.label, color: n.color, size: n.size,
  font: n.font, title: n.title,
  _community: n.community, _community_name: n.community_name,
  _source_file: n.source_file, _file_type: n.file_type, _degree: n.degree,
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  label: '',
  title: e.title,
  dashes: e.dashes,
  width: e.width,
  color: e.color,
  arrows: { to: { enabled: true, scaleFactor: 0.5 } },
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -30,
      centralGravity: 0.001,
      springLength: 100,
      springConstant: 0.15,
      damping: 0.98,
      avoidOverlap: 0.2,
    },
    maxVelocity: 8,
    stabilization: { iterations: 150, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,
  },
  nodes: { shape: 'dot', borderWidth: 1.5 },
  edges: { smooth: { type: 'continuous', roundness: 0.2 }, selectionWidth: 3 },
});

// 1. Matikan fisika setelah graph selesai distabilkan (diam total saat halaman dimuat)
network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
});

// 2. Nyalakan fisika dengan gravitasi KUAT saat Anda menarik node
network.on('dragStart', function (params) {
  network.setOptions({
    physics: {
      enabled: true,
      forceAtlas2Based: {
        gravitationalConstant: -50,   // Tolakan sedang, cukup untuk memisahkan kluster
        centralGravity: 0.0,          // Tidak ada gaya tarik ke tengah layar
        springLength: 30,             // Jarak pegas sangat pendek (agar menempel rapat)
        springConstant: 1.0,          // Pegas sangat kaku (tetangga ditarik kuat)
        damping: 0.96,                // Redaman kuat
        avoidOverlap: 0.2
      }
    }
  });
});

// 3. Matikan fisika SEKETIKA saat Anda melepas node (agar gumpalan membeku)
network.on('dragEnd', function (params) {
  network.setOptions({ physics: { enabled: false } });
});

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" data-nid="${esc(nid)}">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');
  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n.label)}</b></div>
    <div class="field">Type: ${esc(n._file_type || 'unknown')}</div>
    <div class="field">Community: ${esc(n._community_name)}</div>
    <div class="field">Source: ${esc(n._source_file || '-')}</div>
    <div class="field">Degree: ${n._degree}</div>
    ${neighborIds.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

function focusNode(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: !cb.checked }));
    nodesDS.update(updates);
    updateSelectAllState();

    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;

  };

// --- Utility: Debounce & Throttle ---
function debounce(fn, ms) {
  let timer;
  return function(...args) {
    clearTimeout(timer);
    timer = setTimeout(() => fn.apply(this, args), ms);
  };
}

function throttle(fn, ms) {
  let last = 0;
  return function(...args) {
    const now = Date.now();
    if (now - last >= ms) {
      last = now;
      fn.apply(this, args);
    }
  };
}

  if (!preset) return;

  physicsFrozen = false;
  network.setOptions({ physics: preset });
  // Re-enable physics and stabilize
  network.once('stabilizationIterationsDone', () => {

    }
  });
  // Update toolbar active state
  document.querySelectorAll('[data-action="physics-preset"]').forEach(btn => {

// --- Save / Load / Reset Layout (localStorage) ---
const LAYOUT_KEY = 'graphify_layout';

function saveLayout() {
  const positions = network.getPositions();
  const view = network.getViewPosition();
  const scale = network.getScale();
  try {
    localStorage.setItem(LAYOUT_KEY, JSON.stringify({ positions, view, scale }));
  } catch (e) { /* localStorage may be full */ }
}

function loadLayout() {
  try {
    const raw = localStorage.getItem(LAYOUT_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.positions) {
      network.setOptions({ physics: { enabled: false } });
      network.storePositions();
      // Move nodes to saved positions
      Object.keys(data.positions).forEach(id => {
        const pos = data.positions[id];
        if (pos && pos.x !== undefined) {
          nodesDS.update({ id, x: pos.x, y: pos.y, fixed: false });
        }
      });
      if (data.view && data.scale) {
        network.moveTo({ position: data.view, scale: data.scale, animation: true });
      }
    }
  } catch (e) { /* ignore corrupt data */ }
}

function resetLayout() {
  localStorage.removeItem(LAYOUT_KEY);
  network.setOptions({ physics: { enabled: true } });
  network.once('stabilizationIterationsDone', () => {
    network.setOptions({ physics: { enabled: false } });
  });
}

// --- Community Hull (Canvas Overlay) ---
let hullVisible = false;
let hullCanvas = null;
let hullCtx = null;

function initHullCanvas() {
  hullCanvas = document.getElementById('hull-canvas');
  if (!hullCanvas) return;
  hullCtx = hullCanvas.getContext('2d');
  resizeHullCanvas();
}

function resizeHullCanvas() {
  if (!hullCanvas) return;
  const rect = container.getBoundingClientRect();
  hullCanvas.width = rect.width * window.devicePixelRatio;
  hullCanvas.height = rect.height * window.devicePixelRatio;
  hullCanvas.style.width = rect.width + 'px';
  hullCanvas.style.height = rect.height + 'px';
  if (hullCtx) {
    hullCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
}

function drawCommunityHulls() {
  if (!hullVisible || !hullCtx) return;
  const rect = container.getBoundingClientRect();
  hullCtx.clearRect(0, 0, rect.width, rect.height);

  // Group nodes by community
  const commMap = {};
  RAW_NODES.forEach(n => {
    if (nodesDS.get(n.id) && !nodesDS.get(n.id).hidden) {
      if (!commMap[n.community]) commMap[n.community] = [];
      commMap[n.community].push(n.id);
    }
  });

  Object.keys(commMap).forEach(cid => {
    const ids = commMap[cid];
    if (ids.length < 3) return;
    const positions = ids
      .map(id => network.getPositions([id])[id])
      .filter(p => p !== undefined);
    if (positions.length < 3) return;

    // Compute convex hull (simple gift wrapping)
    const hull = convexHull(positions);
    if (hull.length < 3) return;

    const color = LEGEND.find(c => String(c.cid) === cid);
    const fillColor = color ? color.color : '#6366f1';

    hullCtx.save();
    hullCtx.beginPath();
    hullCtx.moveTo(hull[0].x, hull[0].y);
    for (let i = 1; i < hull.length; i++) {
      hullCtx.lineTo(hull[i].x, hull[i].y);
    }
    hullCtx.closePath();

    // Fill with glow
    hullCtx.fillStyle = fillColor;
    hullCtx.globalAlpha = 0.08;
    hullCtx.fill();

    // Stroke
    hullCtx.strokeStyle = fillColor;
    hullCtx.globalAlpha = 0.25;
    hullCtx.lineWidth = 2;
    hullCtx.stroke();

    // Outer glow
    hullCtx.shadowColor = fillColor;
    hullCtx.shadowBlur = 20;
    hullCtx.strokeStyle = fillColor;
    hullCtx.globalAlpha = 0.1;
    hullCtx.lineWidth = 4;
    hullCtx.stroke();

    hullCtx.restore();
  });
}

// Simple convex hull (Gift wrapping / Jarvis march)
function convexHull(points) {
  if (points.length < 3) return points;
  const pts = points.slice();
  // Find leftmost point
  let leftmost = 0;
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].x < pts[leftmost].x) leftmost = i;
  }
  const hull = [];
  let p = leftmost;
  do {
    hull.push(pts[p]);
    let q = (p + 1) % pts.length;
    for (let i = 0; i < pts.length; i++) {
      const cross = (pts[i].x - pts[p].x) * (pts[q].y - pts[p].y) -
                    (pts[i].y - pts[p].y) * (pts[q].x - pts[p].x);
      if (cross > 0) q = i;
    }
    p = q;
  } while (p !== leftmost);
  return hull;
}

function toggleHull() {
  hullVisible = !hullVisible;
  hullCanvas.classList.toggle('visible', hullVisible);
  document.querySelector('[data-action="toggle-hull"]').classList.toggle('active', hullVisible);
  if (hullVisible) {
    drawCommunityHulls();
  }
}

// --- Minimap ---
let minimapVisible = false;
let minimapNetwork = null;
let minimapNodes = null;
let minimapEdges = null;

function initMinimap() {
  const minimapContainer = document.getElementById('minimap');
  if (!minimapContainer) return;

  // Create lightweight datasets for minimap
  minimapNodes = new vis.DataSet();
  minimapEdges = new vis.DataSet();

  // Copy all nodes (smaller size)
  RAW_NODES.forEach(n => {
    minimapNodes.add({
      id: n.id,
      label: '',
      size: 2,
      color: n.color,
      hidden: n.hidden || false,
    });
  });

  // Copy all edges
  RAW_EDGES.forEach((e, i) => {
    minimapEdges.add({
      id: i,
      from: e.from,
      to: e.to,
      color: { opacity: 0.3 },
    });
  });

  minimapNetwork = new vis.Network(minimapContainer, {
    nodes: minimapNodes,
    edges: minimapEdges,
  }, {
    physics: { enabled: false },
    interaction: {
      dragNodes: false,
      dragView: false,
      zoomView: false,
      hover: false,
      tooltipDelay: false,
      navigationButtons: false,
    },
    nodes: { shape: 'dot', borderWidth: 0 },
    edges: { smooth: false },
  });

  // Click on minimap to navigate main graph
  minimapNetwork.on('click', params => {
    if (params.pointer && params.pointer.canvas) {
      const pos = params.pointer.canvas;
      network.moveTo({ position: { x: pos.x, y: pos.y }, animation: true });
    }
  });
}

function updateMinimap() {
  if (!minimapNetwork || !minimapVisible) return;
  // Sync node positions from main network
  const allPositions = network.getPositions();
  const updates = [];
  Object.keys(allPositions).forEach(id => {
    const pos = allPositions[id];
    if (pos) {
      updates.push({ id, x: pos.x, y: pos.y });
    }
  });
  minimapNodes.update(updates);
  minimapNetwork.storePositions();
}

function toggleMinimap() {
  minimapVisible = !minimapVisible;
  document.getElementById('minimap-wrap').classList.toggle('visible', minimapVisible);
  document.querySelector('[data-action="toggle-minimap"]').classList.toggle('active', minimapVisible);
  if (minimapVisible && minimapNetwork) {
    updateMinimap();
  }
}

// --- Realtime Stats ---
function updateRealtimeStats() {
  // PERBAIKAN: Cek apakah elemen ada sebelum melakukan update
  const el = document.getElementById('realtime-stats');
  if (!el) return; 

  const allNodes = nodesDS.get();
  const visibleNodes = allNodes.filter(n => !n.hidden).length;
  const allEdges = edgesDS.get();
  const visibleEdges = allEdges.filter(e => {
    const from = nodesDS.get(e.from);
    const to = nodesDS.get(e.to);
    return from && to && !from.hidden && !to.hidden;
  }).length;
  const visibleCommunities = new Set(
    allNodes.filter(n => !n.hidden).map(n => n._community)
  ).size;
  el.innerHTML =
    `Nodes: ${visibleNodes} | Edges: ${visibleEdges} | Communities: ${visibleCommunities}`;
}

// --- Resize handler with debounce ---
const handleResize = debounce(() => {
  resizeHullCanvas();
  if (hullVisible) drawCommunityHulls();
}, 200);
window.addEventListener('resize', handleResize);

// --- Initialize everything ---
document.addEventListener('DOMContentLoaded', () => {
  // Hide loading overlay
  document.getElementById('loading-overlay').classList.add('hidden');

  // Init toolbar
  initToolbar();

  // Init hull canvas
  initHullCanvas();

  // Init minimap
  initMinimap();

  // Set default physics preset active
  document.querySelector('[data-action="physics-preset"][data-preset="balanced"]').classList.add('active');

  // Update stats periodically
  setInterval(updateRealtimeStats, 2000);
  updateRealtimeStats();

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
      e.preventDefault();
      searchInput.focus();
    }
    if (e.key === 'Escape') {
      searchInput.blur();
      searchResults.style.display = 'none';
    }
  });
});

// Also run immediately in case DOM is already loaded
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  document.dispatchEvent(new Event('DOMContentLoaded'));
}

<script>
// Render hyperedges as shaded regions
const hyperedges = [];
// afterDrawing passes ctx already transformed to network coordinate space.
// Draw node positions raw — no manual pan/zoom/DPR math needed.
network.on('afterDrawing', function(ctx) {
    hyperedges.forEach(h => {
        const positions = h.nodes
            .map(nid => network.getPositions([nid])[nid])
            .filter(p => p !== undefined);
        if (positions.length < 2) return;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = '#6366f1';
        ctx.strokeStyle = '#6366f1';
        ctx.lineWidth = 2;
        ctx.beginPath();
        // Centroid and expanded hull in network coordinates
        const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
        const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
        const expanded = positions.map(p => ({
            x: cx + (p.x - cx) * 1.15,
            y: cy + (p.y - cy) * 1.15
        }));
        ctx.moveTo(expanded[0].x, expanded[0].y);
        expanded.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = 0.4;
        ctx.stroke();
        // Label
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = '#4f46e5';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(h.label, cx, cy - 5);
        ctx.restore();
    });
});
</script>
